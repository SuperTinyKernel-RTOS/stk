name: Test - All (Windows-MinGW, x86)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
    
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure CMake
      run: cmake -G "Unix Makefiles" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_LIB=ON -DBUILD_C_IFACE=ON -DBUILD_TESTS=ON -DTEST_GENERIC=ON -DTEST_SWITCH=ON -DTEST_CHAIN=ON -DTEST_SLEEP=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure