name: Code Coverage - Generic

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PASS_THRESHOLD: 100

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
    - name: Install LCOV
      run: sudo apt update && sudo apt install -y lcov

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Generate Code Coverage
      run: |
        ./coverage.sh \
          -s . \
          -b ${{ github.workspace }}/cov-build \
          -o ${{ github.workspace }}/cov-report \
          -f ${{ github.workspace }}/cov-build/coverage.info

    # - name: Filter Coverage Info
    #   run: |
    #     lcov --remove ${{ github.workspace }}/cov-build/coverage.info \
    #     '*/stk_sync_cv.h' \
    #     '*/stk_sync_event.h' \
    #     '*/stk_sync_mutex.h' \
    #     '*/stk_sync_fastmutex.h' \
    #     '*/stk_sync_pipe.h' \
    #     '*/stk_sync_rwmutex.h' \
    #     '*/stk_sync_semaphore.h' \
    #     '*/stk_sync_spinlock.h' \
    #     -o ${{ github.workspace }}/cov-build/coverage.info

    # Push to main: report and enforce threshold here (no fork code involved)
    - name: Report Code Coverage with Pass Threshold - ${{env.PASS_THRESHOLD}}%
      if: github.event_name == 'push'
      uses: zgosalvez/github-actions-report-lcov@v4
      with:
        coverage-files: ${{github.workspace}}/cov-build/coverage.info
        minimum-coverage: ${{env.PASS_THRESHOLD}}
        artifact-name: code-coverage-report
        github-token: ${{secrets.GITHUB_TOKEN}}
        working-directory: ./

    # Pull request: hand results over to the commenting workflow
    - name: Stage coverage artifact
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        mkdir -p cov-artifact
        cp cov-build/coverage.info cov-artifact/coverage.info
        echo "$PR_NUMBER" > cov-artifact/pr-number

    - name: Upload coverage artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-pr
        path: cov-artifact/
        retention-days: 7
