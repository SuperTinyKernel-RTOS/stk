<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>

  <!-- MCU outer boundary -->
  <rect x="20" y="20" width="780" height="400" rx="14" fill="#fafafa" stroke="#94a3b8" stroke-width="2"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#334155">Cortex-M33 / Armv8-M MCU (TrustZone-enabled)</text>

  <!-- Secure World box -->
  <rect x="50" y="70" width="500" height="320" rx="12" fill="#e0ecff" stroke="#2f6fdb" stroke-width="2"/>
  <text x="72" y="100" font-size="16" font-weight="700" fill="#173a70">Secure World — Secure Binary</text>

  <!-- Kernel box -->
  <rect x="80" y="120" width="180" height="60" rx="8" fill="#2f6fdb" stroke="#173a70" stroke-width="1.5"/>
  <text x="170" y="146" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">STK Kernel</text>
  <text x="170" y="165" font-size="11.5" fill="#dbe8ff" text-anchor="middle">(Secure)</text>

  <!-- Task boxes -->
  <rect x="320" y="115" width="200" height="42" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="420" y="140" font-size="12.5" fill="#173a70" text-anchor="middle">Task 1 (Secure)</text>

  <rect x="320" y="167" width="200" height="42" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="420" y="192" font-size="12.5" fill="#173a70" text-anchor="middle">Task 2 (Secure)</text>

  <rect x="320" y="219" width="200" height="42" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="420" y="244" font-size="12.5" fill="#173a70" text-anchor="middle">Task N (Secure)</text>

  <!-- Scheduling arrows: kernel -> tasks -->
  <path d="M 260 136 L 315 136" stroke="#173a70" stroke-width="1.6" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 260 150 L 300 188" stroke="#173a70" stroke-width="1.6" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 260 165 L 300 240" stroke="#173a70" stroke-width="1.6" fill="none" marker-end="url(#arrow1)"/>

  <!-- hardware-enforced note inside secure box -->
  <rect x="80" y="290" width="440" height="78" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="100" y="313" font-size="12.5" fill="#173a70" font-weight="600">All STK tasks run Secure:</text>
  <text x="100" y="333" font-size="11.5" fill="#334155">Kernel + all application tasks reside in one Secure binary.</text>
  <text x="100" y="350" font-size="11.5" fill="#334155">A Non-Secure world may still exist on the chip, but STK</text>
  <text x="100" y="366" font-size="11.5" fill="#334155">does not schedule or manage any tasks running there.</text>

  <!-- Non-Secure world box (may exist, but not managed by STK) -->
  <rect x="580" y="70" width="200" height="320" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="100" font-size="13.5" font-weight="700" fill="#64748b">Non-Secure World</text>
  <text x="600" y="118" font-size="11" fill="#94a3b8">(optional, not managed by STK)</text>

  <g opacity="0.7">
    <rect x="600" y="145" width="160" height="150" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="680" y="208" font-size="11" fill="#64748b" text-anchor="middle">Non-Secure code may</text>
    <text x="680" y="224" font-size="11" fill="#64748b" text-anchor="middle">run independently</text>
    <text x="680" y="248" font-size="11" fill="#64748b" text-anchor="middle">(no STK tasks</text>
    <text x="680" y="264" font-size="11" fill="#64748b" text-anchor="middle">scheduled here)</text>
  </g>

  <!-- barrier between secure and unused ns -->
  <line x1="565" y1="80" x2="565" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Legend -->
  <rect x="50" y="405" width="14" height="14" fill="#2f6fdb"/>
  <text x="70" y="416" font-size="11.5" fill="#334155">Secure state (Cortex-M driver, open source)</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#173a70"/>
    </marker>
  </defs>

</svg>
